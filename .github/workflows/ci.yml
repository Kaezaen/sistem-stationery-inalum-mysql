name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (PHP 8.4 + MySQL)
    runs-on: ubuntu-latest

    # Service container hanya dipakai CI. Ketentuan "tanpa Docker" berlaku untuk
    # deployment produksi (lihat roadmap), bukan untuk runner pengujian. MySQL 8.0
    # (>= 8.0.16) menegakkan CHECK constraint — prasyarat uji integritas T4/T5/T11.
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: taajri_stationery_test
          MYSQL_USER: taajri
          MYSQL_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=30s

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, bcmath, intl, gd, zip
          coverage: none

      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Siapkan environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Lint (Pint)
        run: vendor/bin/pint --test

      - name: Analisis statis (PHPStan level 6)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Uji batas modul
        run: vendor/bin/pest --testsuite=Architecture

      - name: Uji lengkap
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: taajri_stationery_test
          DB_USERNAME: taajri
          DB_PASSWORD: secret
        run: vendor/bin/pest

  frontend:
    name: Frontend (React 19 + TypeScript)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Cek tipe
        run: npm run types

      - name: Lint
        run: npm run lint

      - name: Cek format
        run: npm run format:check

      - name: Build produksi
        run: npm run build
